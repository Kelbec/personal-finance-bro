[project]
name = "personal-finance-bro"
version = "0.1.0"
description = "Gestione locale di cashflow e investimenti a partire dagli export di Trade Republic e BPER"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlmodel>=0.0.22",
    "pandas>=2.2",
    "xlrd>=2.0",       # export BPER (.xls Excel 97)
    "openpyxl>=3.1",   # migrazione storico dai fogli Google (.xlsx)
]

[project.optional-dependencies]
app = ["flet>=1.0"]
prices = ["yfinance>=0.2"]
assistant = ["ollama>=0.4"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pfb_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
