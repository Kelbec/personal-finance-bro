[project]
name = "personal-finance-bro"
version = "0.1.0"
description = "Gestione locale di cashflow e investimenti a partire dagli export di Trade Republic e BPER"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "sqlmodel>=0.0.22",
    "xlrd>=2.0",       # export BPER (.xls Excel 97)
    "openpyxl>=3.1",   # migrazione storico dai fogli Google (.xlsx)
]

[project.optional-dependencies]
app = ["flet>=1.0"]
web = ["flet>=1.0", "flet-web>=1.0"]  # modalità web sul Raspberry Pi
prices = ["yfinance>=0.2"]
sheets = ["gspread>=6"]  # sincronizzazione col foglio Google condiviso
assistant = ["ollama>=0.4"]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6", "xlwt>=1.3"]  # xlwt: genera .xls BPER finti nei test

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pfb_core", "src/pfb_app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.flet]
product = "Personal Finance Bro"
artifact = "finance-bro"
org = "com.kelbec"  # bundle id: com.kelbec.finance_bro
company = "Kelbec"

[tool.flet.app]
path = "src"  # main.py e i pacchetti pfb_core / pfb_app finiscono nell'APK
exclude = [".flet", "__pycache__"]  # .flet: storage di `flet run`, mai nell'APK

[tool.flet.android]
# flet build aggiunge flet da solo solo se il progetto non ha dipendenze: qui va dichiarato.
# certifi: lo script di avvio dell'APK lo importa prima di main.py (certificati HTTPS).
# gspread: sincronizzazione col foglio Google (config e chiave si importano dalla schermata Dati).
dependencies = ["flet==1.0.3", "certifi", "gspread>=6"]
split_per_abi = true  # un APK per architettura: quello arm64-v8a va bene per i telefoni recenti

# il template di Flet 1.0.3 fissa jni 1.0.0, ma jni_flutter >= 1.0.4 richiede jni ^1.1:
# senza questo blocco la compilazione Flutter fallisce (JniVersionCheck)
[tool.flet.flutter.pubspec.dependency_overrides]
jni_flutter = "1.0.1"
