# Copia questo file in config.toml (ignorato da git) e compila i tuoi dati.

[database]
path = "data/pfb.sqlite"

[owner]
name = "Marco"

# IBAN dei tuoi conti: servono a riconoscere i giroconti interni,
# che vengono esclusi dal cashflow.
[[accounts]]
name = "BPER"
kind = "conto"
source = "xls_bper"
iban = "IT00X0000000000000000000000"

[[accounts]]
name = "Trade Republic"
kind = "broker"
source = "csv_tr"
iban = "IT00X0000000000000000000000"

[[accounts]]
name = "PayPal"
kind = "wallet"
source = "manuale"

[[accounts]]
name = "Satispay"
kind = "wallet"
source = "manuale"

# Regole personali di categorizzazione (priorità 20: dopo il tipo operazione,
# prima di esercenti e codici MCC). Campi: type, counterparty, iban, mcc,
# bank_category, description. counterparty/description sono regex case-insensitive.
[[rules]]
field = "counterparty"
pattern = "NOME DATORE DI LAVORO"
category = "Stipendio/Pensione"

[[rules]]
field = "bank_category"
pattern = "F24"
category = "Costi attività lavorativa"

[[rules]]
field = "counterparty"
pattern = "NOME COMMERCIALISTA"
category = "Costi attività lavorativa"

# Bonifici su BPER in arrivo da Trade Republic (ABI 03674): giroconto
[[rules]]
field = "description"
pattern = "ABI-CAB: 03674"
internal = true

# Strumenti: simbolo Yahoo Finance per scaricare i prezzi (in EUR), asset class
# (stock, bond, commodity) o strumenti nuovi non presenti nel seed. Esempio:
# [[instruments]]
# isin = "JE00BQRFDY49"
# yahoo_symbol = "WSLV.MI"

# Sincronizzazione (facoltativa) verso il foglio Google condiviso: tasto "Sincronizza Google
# Sheet" nella schermata Aggiungi, oppure `python -m pfb_core sync-sheet`. Senza questa
# sezione nessun dato lascia il computer. Vedi README → "Foglio Google condiviso".
# [google_sheet]
# foglio = "https://docs.google.com/spreadsheets/d/..."   # URL o ID
# credenziali = "google-credentials.json"   # chiave dell'account di servizio (fuori da git)
# dal = "2026-05-01"                         # invia i movimenti da questa data in poi
# [google_sheet.schede]                      # intestatario -> scheda in cui scrivere
# Marco = "CashFlowMarco2025"
