name: Release APK

# Due modi per rilasciare:
# - tag di versione: git tag v0.3.0 && git push origin v0.3.0
# - a mano, anche dal telefono: Actions → Release APK → Run workflow (ramo main). Il tag
#   vX.Y.Z viene creato dal workflow stesso, con la versione di pyproject.toml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write  # serve a creare la release e ad allegarle gli APK

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5

      - name: Tag della release
        run: |
          toml=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$GITHUB_REF" != "refs/heads/main" ]; then
              echo "::error::Si rilascia solo dal ramo main (scelto: $GITHUB_REF_NAME)"
              exit 1
            fi
            tag="v$toml"
            if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
              echo "::error::Il tag $tag esiste già: alza la versione in pyproject.toml e in src/pfb_core/__init__.py"
              exit 1
            fi
          else
            tag="$GITHUB_REF_NAME"
          fi
          echo "RELEASE_TAG=$tag" >> "$GITHUB_ENV"
          echo "Release $tag"

      - name: La versione del tag coincide con quella del codice
        run: |
          tag="${RELEASE_TAG#v}"
          toml=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          code=$(grep -m1 '__version__' src/pfb_core/__init__.py | cut -d'"' -f2)
          echo "tag=$tag pyproject=$toml pfb_core=$code"
          if [ "$tag" != "$toml" ] || [ "$tag" != "$code" ]; then
            echo "::error::Il tag v$tag non coincide con la versione in pyproject.toml ($toml) e src/pfb_core/__init__.py ($code)"
            exit 1
          fi

      - run: uv sync --group dev --extra app
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

      # Un APK firmato sempre con la stessa chiave si installa sopra il precedente senza
      # disinstallare (e senza perdere il database del telefono). Senza il secret la build
      # usa la chiave di debug del runner, diversa a ogni esecuzione.
      - name: Chiave di firma (facoltativa)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::warning::Nessuna chiave di firma (secret ANDROID_KEYSTORE_BASE64): l'APK non si installerà sopra una versione firmata con un'altra chiave"
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          {
            echo "FLET_ANDROID_SIGNING_KEY_STORE=$RUNNER_TEMP/release.jks"
            echo "FLET_ANDROID_SIGNING_KEY_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "FLET_ANDROID_SIGNING_KEY_PASSWORD=$KEYSTORE_PASSWORD"
            echo "FLET_ANDROID_SIGNING_KEY_ALIAS=${KEY_ALIAS:-pfb}"
          } >> "$GITHUB_ENV"

      - name: Build APK
        # --build-number: il versionCode di Android deve crescere a ogni release
        run: uv run --extra app flet build apk --yes --build-number ${{ github.run_number }}

      - name: Rinomina gli APK con la versione
        run: |
          ls -l build/apk
          mkdir dist
          for f in build/apk/*.apk; do
            # flet li chiama <artifact>-<abi>.apk (es. finance-bro-arm64-v8a.apk)
            abi=$(basename "$f" .apk | grep -oE '(arm64-v8a|armeabi-v7a|x86_64|x86)$' || echo universale)
            out="dist/finance-bro-${RELEASE_TAG}-${abi}.apk"
            if [ -e "$out" ]; then
              echo "::error::Due APK avrebbero lo stesso nome ($out): uno sovrascriverebbe l'altro"
              exit 1
            fi
            cp "$f" "$out"
          done
          ls -l dist
          # il telefono ha bisogno dell'APK arm64-v8a: senza, l'installazione dà "App non installata"
          if [ "$(ls dist | grep -c -e arm64-v8a -e universale)" -eq 0 ]; then
            echo "::error::Nessun APK arm64-v8a (né universale) tra gli APK compilati"
            exit 1
          fi

      - name: Crea la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # --target vale solo se il tag non esiste ancora (avvio a mano): lo crea su questo commit
          gh release create "$RELEASE_TAG" dist/*.apk \
            --title "$RELEASE_TAG" --generate-notes --target "$GITHUB_SHA"
